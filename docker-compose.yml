services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nestpro:latest
    container_name: nestpro-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: ${APP_NAME:-NestPro}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}

      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Database (MySQL by default in compose)
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-nestpro}
      DB_USERNAME: ${DB_USERNAME:-nestpro}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

      # Drivers suitable for a simple single-host deployment
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}

      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: nestpro-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nestpro}
      MYSQL_USER: ${DB_USERNAME:-nestpro}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Uncomment to expose MySQL on the host
    # ports:
    #   - "3306:3306"

volumes:
  db_data:
  storage:
  bootstrap_cache:
