services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nestpro:latest
    container_name: nestpro-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-2030}:80"
    environment:
      APP_NAME: ${APP_NAME:-NestPro}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:2030}

      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Existing/external database connection
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-nestpro}
      DB_USERNAME: ${DB_USERNAME:-nestpro}
      DB_PASSWORD: ${DB_PASSWORD:-}

      # App drivers (database-backed drivers work without Redis)
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}

      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache

volumes:
  storage:
  bootstrap_cache:
